apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-kubernetes-devsecops-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/secure-kubernetes-devsecops-platform.git
    targetRevision: main
    path: k8s/overlays/eks
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
