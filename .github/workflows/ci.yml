
name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secret and Vulnerability Scanning
    runs-on: ubuntu-latest

    steps:
      # Fetch complete history for secret scanning
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scan repository history for exposed secrets
      - name: Scan secrets with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --verbose --exit-code 1

      # Scan dependencies, secrets, and misconfigurations
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

