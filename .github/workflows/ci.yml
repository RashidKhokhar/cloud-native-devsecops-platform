name: DevSecOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  BACKEND_IMAGE: secure-platform-backend
  FRONTEND_IMAGE: secure-platform-frontend
  PROD_TAG: production

jobs:
  dependency-scan:
    name: Dependency and package scanning (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r app/backend/requirements.txt --format columns
      - name: Install frontend dependencies
        run: npm install --prefix app/frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix app/frontend --audit-level=high

  lint-and-unit-tests:
    name: Lint + unit tests + coverage
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install flake8 pytest pytest-cov
      - name: Run lint checks
        run: flake8 app/backend --max-line-length=120
      - name: Run unit tests with coverage
        run: pytest app/backend --maxfail=1 --disable-warnings --cov=app/backend --cov-report=xml --cov-report=term

  sast:
    name: SAST and static analysis
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep
      - name: Run Bandit
        run: |
          bandit -r app/backend -f json -o bandit-report.json || true
      - name: Run Semgrep
        run: |
          semgrep --config auto app/backend --json --output semgrep-report.json || true

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: sast
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: ${{ secrets.SONAR_ORG || 'your-org' }}
      SONAR_PROJECT: ${{ secrets.SONAR_PROJECT || 'secure-kubernetes-devsecops-platform' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT }}

  integration-tests:
    name: Functional and integration tests
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, sast]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate CI secrets
        run: |
          test -n "$POSTGRES_PASSWORD" || { echo "::error::POSTGRES_PASSWORD repository secret is missing or empty"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "::error::DJANGO_SECRET_KEY repository secret is missing or empty"; exit 1; }
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Start platform with Docker Compose
        run: docker compose up -d --build --wait
      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=150 || true
      - name: Verify containers are running
        run: docker compose ps
      - name: Smoke test backend service
        run: docker compose exec -T backend python -c "import django; print(django.get_version())"
      - name: Smoke test frontend
        run: curl --fail --retry 5 --retry-delay 2 --retry-connrefused -I http://localhost:8085
      - name: Stop containers
        if: always()
        run: docker compose down -v || true

  docker-security:
    name: Docker image build + Trivy scan
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./app/backend
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:${{ env.PROD_TAG }}
      - name: Build frontend image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./app/frontend
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:${{ env.PROD_TAG }}
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  dast:
    name: Dynamic security testing (DAST)
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate CI secrets
        run: |
          test -n "$POSTGRES_PASSWORD" || { echo "::error::POSTGRES_PASSWORD repository secret is missing or empty"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "::error::DJANGO_SECRET_KEY repository secret is missing or empty"; exit 1; }
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Start stack for DAST testing
        run: docker compose up -d --build --wait
      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=150 || true
      - name: Verify target responds
        run: curl --fail --retry 5 --retry-delay 2 --retry-connrefused -I http://localhost:8085
      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8085 -r zap-report.html -I
      - name: Stop containers
        if: always()
        run: docker compose down -v || true

  release-readiness:
    name: Release readiness and production tagging
    runs-on: ubuntu-latest
    needs: [dependency-scan, lint-and-unit-tests, sast, sonarqube, integration-tests, docker-security, dast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm production-ready artifacts
        run: |
          echo "Dependency scan passed"
          echo "Lint and unit tests completed"
          echo "SAST and static analysis completed"
          echo "Security and DAST checks completed"
          echo "Docker images tagged for release: ${BACKEND_IMAGE}:${PROD_TAG}, ${FRONTEND_IMAGE}:${PROD_TAG}"
          echo "Repository is ready for production deployment flow."
